<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WsCube Tech</title>
    <!--Linking Internal Css-->
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/media.css" />
    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!--BS CDN-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!--Font Awesome CDN-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!--Header-->
    <header class="container-fluid py-2 shadow-lg">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-6 col-12">
            <img src="./images/logo.svg" alt="WsCube Tech Logo" />
          </div>
          <div class="col-md-6 col-12">
            <div class="float-btn d-flex gap-4 justify-content-lg-end">
              <button class="whatsapp-cta">
                <i class="fa-brands fa-whatsapp"></i> Chat with Us
              </button>
              <button class="call-cta">Call Us</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!--Hero Section-->
    <section class="container-fluid hs bg-white">
      <div class="container">
        <div class="row justify-content-lg-between gy-5 gy-xl-0">
          <div class="col-xl-6 col-12">
            <h1 class="hs_heading mb-0">
              Career Opportunities<br />
              in
              <span class="hs_highlight mb-0">Digital Marketing</span>
            </h1>
            <p class="hs_para mb-0">
              Digital marketing course so good,you only pay-after-placement
            </p>
            <ul class="hs_list p-0">
              <li>
                <i class="fa-solid fa-circle-check"></i> Specialization:
                Performance Marketing
              </li>
              <li>
                <i class="fa-solid fa-circle-check"></i> Min salary of Rs 4.5
                LPA
              </li>
              <li><i class="fa-solid fa-circle-check"></i> 50 seats only</li>
            </ul>
            <div class="d-flex btn-hs-parent gap-4 py-3">
              <button class="btn-demo btn-group">Book 2 Days Demo</button>
              <button class="btn-download btn-group d-flex gap-3">
                <i class="fa-solid fa-arrow-down"></i>Download Curriculum
              </button>
            </div>
          </div>
          <div class="col-xl-5 col-12 shadow-lg hs-form">
            <div>
              <h3 class="mb-3 form-heading">Book Your Free Class Now!</h3>
              <p class="mb-3 form-desc">
                2 days of free demo classes without paying in advance!
              </p>
            </div>
            <div class="form-main">
              <!--Name Field-->
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input
                  type="name"
                  class="form-control"
                  id="name"
                  placeholder="Enter Your Name"
                />
              </div>

              <!--Email Field-->
              <div class="mb-3">
                <label for="email" class="form-label">Name</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="Enter Your Email"
                />
              </div>

              <!--Phone Field-->
              <div class="mb-3">
                <label for="">Phone</label>
                <div class="input-group mt-2">
                  <span class="input-group-text" id="basic-addon1">+91</span>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Enter Your Mobile Number"
                  aria-label="Username"
                  aria-describedby="basic-addon1"
                />
                </div>
               
              </div>

            </div>
          </div>
        </div>
      </div>
    </section>

    <!--BS Scripts-->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
  </body>
</html>
